apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: notch-mgmt
  region: eu-west-1
  version: "1.33"

iam:
  withOIDC: true
  serviceAccounts:
    # The external-secrets Helm release runs with serviceAccount.create=false and
    # reuses this SA, so eksctl must run before ArgoCD syncs the addon.
    # Read-only, and only on the notch/ prefix.
    - metadata:
        name: external-secrets
        namespace: external-secrets
      roleName: notch-eso
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: arn:aws:secretsmanager:eu-west-1:570056717182:secret:notch/*
          # ListSecrets and BatchGetSecretValue have no resource-level scoping,
          # and the ExternalSecret `find` generator needs both.
          - Effect: Allow
            Action:
              - secretsmanager:ListSecrets
              - secretsmanager:BatchGetSecretValue
            Resource: "*"

    # roleOnly: Crossplane creates this SA itself from the DeploymentRuntimeConfig
    # in notch-gitops/platform/addons/crossplane/runtime-config.yaml, which carries
    # the eks.amazonaws.com/role-arn annotation. eksctl only needs the role and its
    # OIDC trust policy for system:serviceaccount:crossplane-system:provider-aws.
    - metadata:
        name: provider-aws
        namespace: crossplane-system
      roleName: notch-crossplane-aws
      roleOnly: true
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess

# CloudNativePG needs PersistentVolumes, and EKS >=1.23 does not ship the EBS CSI
# driver by default.
addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

vpc:
  nat:
    gateway: Disable # this is what actually prevents the ~£30/mo NAT

managedNodeGroups:
- name: default
  instanceTypes: [ "t3.medium", "t3a.medium" ]
  spot: true
  desiredCapacity: 2
  minSize: 1
  maxSize: 4
  privateNetworking: false # nodes in public subnets
  volumeSize: 30
