apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: notch-mgmt
  region: eu-west-1
  version: "1.33"

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: external-secrets
        namespace: external-secrets
      roleName: notch-eso
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite

vpc:
  nat:
    gateway: Disable # this is what actually prevents the ~£30/mo NAT

managedNodeGroups:
- name: default
  instanceTypes: [ "t3.medium", "t3a.medium" ]
  spot: true
  desiredCapacity: 2
  minSize: 1
  maxSize: 4
  privateNetworking: false # nodes in public subnets
  volumeSize: 30

serviceAccounts:
    - metadata:
        name: external-secrets
        namespace: external-secrets
      roleName: notch-eso
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
    - metadata:
        name: provider-aws
        namespace: crossplane-system
      roleName: notch-crossplane-aws
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonRDSFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess