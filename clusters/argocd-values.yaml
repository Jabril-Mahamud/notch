# ArgoCD bootstrap values, applied by kind-up.sh on every run (helm upgrade).
# oidc.config is rendered there too: it embeds this machine's notch CA.
configs:
  params:
    # TLS ends at the ingress, like every other notch.localhost app.
    server.insecure: true
  cm:
    url: https://argocd.notch.localhost
  rbac:
    # Mirrors Yalla's argocd-rbac-cm: groups from the IdP map to roles.
    # ponytail: tenants get read-only on everything. Per-tenant AppProjects with
    # role groups are the upgrade when tenants need to sync their own apps.
    policy.default: role:readonly
    policy.csv: |
      g, notch-admins, role:admin
    scopes: "[groups]"
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.notch.localhost
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: notch-ca
