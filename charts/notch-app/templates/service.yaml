{{- if .Values.service.ports -}}
{{- $name := include "notch-app.name" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "notch-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "notch-app.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ required "each service.ports entry needs a name" .name }}
      port: {{ required (printf "service port %s needs a port" .name) .port }}
      {{- /* Named target ports keep the Service tied to a specific container. */}}
      targetPort: {{ .targetPort | default .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
{{- end }}
