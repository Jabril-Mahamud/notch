{{- if .Values.service.externalSecret.enabled -}}
{{- $name := include "notch-app.name" . -}}
{{- $env := include "notch-app.env" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "notch-app.secretName" . | quote }}
  labels:
    {{- include "notch-app.labels" . | nindent 4 }}
  annotations:
    # Ahead of the Deployment so the Secret exists before pods start.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretStoreRef:
    name: notch-secret-store
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.service.externalSecret.refreshInterval | default "1m" | quote }}
  target:
    # creationPolicy Owner means ESO fully owns this Secret. Nothing else may
    # write to it - database credentials live in their own Crossplane-owned
    # secret and are wired in via containers.<c>.envSecrets.
    name: {{ include "notch-app.secretName" . | quote }}
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: {{ printf "^notch/%s/apps/%s/" $env $name | quote }}
      rewrite:
        - regexp:
            source: {{ printf ".*/apps/%s/(.*)" $name | quote }}
            target: "$1"
{{- end }}
