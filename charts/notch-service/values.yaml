# Set by the tenant-services ApplicationSet: deploy into the tenant's namespace
# instead of one named after the service.
namespace: ""

# Everything comes from services/<name>/service.yaml + <env>/values.yaml.
service: {}

# Platform-level names the chart points at; the objects live outside it.
# Kubernetes-provider store reading from a central namespace. The source Secret
# can't share the target's name and namespace, or ESO overwrites its own input.
secretStore: notch-secrets
# Tempo's OTLP/HTTP receiver, injected as OTEL_EXPORTER_OTLP_ENDPOINT.
otlpEndpoint: http://tempo.tempo.svc:4318
