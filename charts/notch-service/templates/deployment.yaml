{{- $svc := .Values.service }}
{{- $name := include "notch.name" . }}
{{- $seen := dict }}
{{- $containers := list }}
{{- range $cname, $c := required "service.deployment.containers is required" (dig "deployment" "containers" nil $svc) }}
{{- $c = $c | default dict }}
{{- /* Single-container services skip ports: they inherit the service ports */}}
{{- $raw := $c.ports }}
{{- if not $raw }}
{{- $raw = list }}
{{- range $svc.ports }}{{ $raw = append $raw (dict "name" .name "containerPort" .port) }}{{ end }}
{{- end }}
{{- $ports := list }}
{{- range $raw }}
{{- /* Port names are pod-wide: two containers both naming a port "http" collide */}}
{{- if hasKey $seen .name }}{{ fail (printf "port name %q is used by more than one container" .name) }}{{ end }}
{{- $_ := set $seen .name true }}
{{- $ports = append $ports (merge (deepCopy .) (dict "protocol" "TCP")) }}
{{- end }}
{{- $out := omit $c "image" "ports" }}
{{- $_ := set $out "name" $cname }}
{{- $_ := set $out "image" (required (printf "service.deployment.containers.%s.image.ref is required" $cname) (dig "image" "ref" "" $c)) }}
{{- with $ports }}
{{- $_ := set $out "ports" . }}
{{- $probe := dict "tcpSocket" (dict "port" (first .).name) }}
{{- if not $c.readinessProbe }}{{ $_ := set $out "readinessProbe" $probe }}{{ end }}
{{- if not $c.livenessProbe }}{{ $_ := set $out "livenessProbe" $probe }}{{ end }}
{{- end }}
{{- if $svc.secrets }}
{{- $_ := set $out "envFrom" (append ($c.envFrom | default list) (dict "secretRef" (dict "name" (printf "%s-secrets" $name)))) }}
{{- end }}
{{- /* Platform env first, container env last: k8s only expands $(VAR) from earlier entries, so apps can build on $(PGHOST) etc. */}}
{{- $platform := list }}
{{- if $svc.postgres }}
{{- /* provider-sql writes endpoint, not host */}}
{{- range $k, $key := dict "PGHOST" "endpoint" "PGPORT" "port" "PGUSER" "username" "PGPASSWORD" "password" }}
{{- $platform = append $platform (dict "name" $k "valueFrom" (dict "secretKeyRef" (dict "name" (printf "%s-db" $name) "key" $key))) }}
{{- end }}
{{- $platform = append $platform (dict "name" "PGDATABASE" "value" (include "notch.id" $)) }}
{{- /* The Heroku/Railway convention most apps read. provider-sql passwords are alphanumeric, so no URL-encoding */}}
{{- $platform = append $platform (dict "name" "DATABASE_URL" "value" "postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)") }}
{{- end }}
{{- /* Standard OTel SDK vars: apps that don't trace ignore them. Tempo only takes traces, so metrics/logs exporters are off */}}
{{- range $k, $v := dict "OTEL_EXPORTER_OTLP_ENDPOINT" $.Values.otlpEndpoint "OTEL_EXPORTER_OTLP_PROTOCOL" "http/protobuf" "OTEL_SERVICE_NAME" $name "OTEL_METRICS_EXPORTER" "none" "OTEL_LOGS_EXPORTER" "none" }}
{{- $platform = append $platform (dict "name" $k "value" $v) }}
{{- end }}
{{- if $svc.auth }}
{{- /* The secret has no other route in: scripts/app-clients.sh writes it to notch-secrets, ESO syncs it */}}
{{- if not (has "OIDC_CLIENT_SECRET" ($svc.secrets | default list)) }}{{ fail "auth needs OIDC_CLIENT_SECRET in secrets" }}{{ end }}
{{- /* Realm clients are global, so tenant services get the tenant-prefixed id */}}
{{- $platform = concat $platform (list (dict "name" "OIDC_ISSUER" "value" $.Values.oidcIssuer) (dict "name" "OIDC_CLIENT_ID" "value" (include "notch.id" $))) }}
{{- $platform = append $platform (dict "name" "OIDC_CLIENT_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" (printf "%s-secrets" $name) "key" "OIDC_CLIENT_SECRET"))) }}
{{- end }}
{{- /* A container var replaces the platform one of the same name; duplicates break server-side apply */}}
{{- $own := dict }}
{{- range $c.env }}{{ $_ := set $own .name true }}{{ end }}
{{- $env := list }}
{{- range $platform }}{{ if not (hasKey $own .name) }}{{ $env = append $env . }}{{ end }}{{ end }}
{{- $_ := set $out "env" (concat $env ($c.env | default list)) }}
{{- $containers = append $containers $out }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "notch.namespace" . }}
  annotations:
    # Roll pods when the synced secret or db creds change
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "notch.labels" . | nindent 4 }}
spec:
  replicas: {{ dig "deployment" "replicas" 1 $svc }}
  selector:
    matchLabels:
      {{- include "notch.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notch.labels" . | nindent 8 }}
    spec:
      containers:
        {{- toYaml $containers | nindent 8 }}
