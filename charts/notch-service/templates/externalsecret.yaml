{{- with .Values.service.secrets }}
{{- $name := include "notch.name" $ }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ include "notch.namespace" $ }}
  annotations:
    # Before the Deployment, so envFrom finds the Secret on first start
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "notch.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore }}
  target:
    name: {{ $name }}-secrets
  data:
    {{- range . }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ include "notch.id" $ }}-secrets
        property: {{ . }}
    {{- end }}
{{- end }}
