{{- if .Values.service.postgres }}
{{- $name := include "notch.name" . }}
# The platform's Postgres API (addons/notch-postgres): the Composition decides
# what backs it, so this claim stays the same on Kind and in the cloud.
apiVersion: notch.dev/v1alpha1
kind: NotchPostgres
metadata:
  name: {{ $name }}
  namespace: {{ include "notch.namespace" . }}
  annotations:
    # Before the Deployment: its PG* env reads the secret this writes.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "notch.labels" . | nindent 4 }}
spec:
  # Database and role names are cluster-wide in the shared Postgres: notch.id
  # prefixes tenant services.
  databaseName: {{ include "notch.id" . }}
  # endpoint/port/username/password, read by the Deployment's PG* env
  writeConnectionSecretToRef:
    name: {{ $name }}-db
{{- end }}
