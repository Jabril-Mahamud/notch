# Generated by notch add.
service:
  name: demo
  # One container per component; the ingress splits by path on one host.
  ports:
    - name: http-backend
      port: 8000
      targetPort: backend
      path: /api
    - name: http-frontend
      port: 3000
      targetPort: frontend
      path: /
  deployment:
    containers:
      backend:
        ports:
          - name: backend
            containerPort: 8000
        env:
          - name: PORT
            value: "8000"
      frontend:
        ports:
          - name: frontend
            containerPort: 3000
        env:
          - name: PORT
            value: "3000"
  postgres: true
