# Two containers: each declares its own ports, ingress splits by path.
service:
  name: web
  ports:
    - name: http-frontend
      port: 80
      targetPort: frontend
      path: /
    - name: http-backend
      port: 8080
      targetPort: backend
      path: /api
  deployment:
    containers:
      frontend:
        ports:
          - name: frontend
            containerPort: 3000
      backend:
        ports:
          - name: backend
            containerPort: 8000
        readinessProbe:
          httpGet: { path: /health, port: backend }
