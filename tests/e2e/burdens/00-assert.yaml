# Phase 3 acceptance: Burdens (a frontend/ + backend/ monorepo) onboarded with
# notch add, two containers in one pod, split by path on one host.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: burdens
  namespace: argocd
status:
  sync:
    status: Synced
  health:
    status: Healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burdens
  namespace: burdens
status:
  readyReplicas: 1
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |
      set -e
      # / is the Next.js frontend
      curl -sf http://burdens.notch.localhost:8080/ >/dev/null
      # /api reaches FastAPI: its 401 JSON, not the frontend's 404 page
      curl -s http://burdens.notch.localhost:8080/api/todos | grep -q '"Not authenticated"'
