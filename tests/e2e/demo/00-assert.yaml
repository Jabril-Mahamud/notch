# Phase 3: github.com/Jabril-Mahamud/notch-demo (scaffolded by `notch new`),
# end to end: Next.js at /, FastAPI at /api, a todo written to its Postgres,
# and live weather fetched from Open-Meteo (needs internet egress).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
status:
  sync:
    status: Synced
  health:
    status: Healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
status:
  readyReplicas: 1
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # Pulled from notch-registry, not side-loaded: readyReplicas above proves the pull worked.
  - script: |
      set -e
      IMAGES=$(kubectl -n demo get deploy demo -o jsonpath='{.spec.template.spec.containers[*].image}')
      [ -n "$IMAGES" ]
      for i in $IMAGES; do case $i in localhost:5001/*) ;; *) echo "not from the registry: $i"; exit 1 ;; esac; done
  - script: |
      set -e
      H=http://demo.notch.localhost:8080
      curl -sf $H/ | grep -q 'Hello, world'
      ID=$(curl -sf -X POST $H/api/todos -H 'Content-Type: application/json' -d '{"title":"kuttl"}' | sed -E 's/.*"id":([0-9]+).*/\1/')
      curl -sf $H/api/todos | grep -q '"title":"kuttl"'
      curl -sf -X DELETE $H/api/todos/$ID
      curl -sf $H/api/weather | grep -q '"temperature_c"'
