# hello (a public GitHub starter, deployed with notch add) end to end: DB, secret, ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
status:
  sync:
    status: Synced
  health:
    status: Healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
status:
  readyReplicas: 1
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
# Conditions are lists, which kuttl matches whole; kubectl wait checks one entry.
commands:
  # Pulled from notch-registry, not side-loaded: readyReplicas above proves the pull worked.
  - script: |
      set -e
      IMAGES=$(kubectl -n hello get deploy hello -o jsonpath='{.spec.template.spec.containers[*].image}')
      [ -n "$IMAGES" ]
      for i in $IMAGES; do case $i in localhost:5001/*) ;; *) echo "not from the registry: $i"; exit 1 ;; esac; done
  # Ready = the composed Role and Database are Ready and <service>-db is written.
  - command: kubectl -n hello wait --for=condition=Ready notchpostgres/hello --timeout=10s
  - command: kubectl -n hello wait --for=condition=Ready externalsecret/hello-secrets --timeout=10s
  - command: kubectl -n hello wait --for=condition=Ready certificate/hello-tls --timeout=10s
  # Served over TLS signed by the notch CA, and plain http redirects there.
  - script: |
      set -e
      curl -sf --cacert "${NOTCH_HOME:-$HOME/.config/notch}/ca/ca.crt" https://hello.notch.localhost/ >/dev/null
      [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://hello.notch.localhost:8080/)" = "308 https://hello.notch.localhost/" ]
