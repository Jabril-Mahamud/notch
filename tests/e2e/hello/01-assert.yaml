# A request to hello leaves a trace in Tempo. Tempo's image has no shell, so
# the search goes through the API server's service proxy. kuttl retries the
# whole command until timeout, which covers Tempo's ingest delay.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |
      curl -sf http://hello.notch.localhost:8080/health >/dev/null
      kubectl get --raw '/api/v1/namespaces/tempo/services/tempo:3200/proxy/api/search?tags=service.name%3Dhello' | grep -q traceID
