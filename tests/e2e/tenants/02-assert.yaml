# Network policies: a listener in team-alpha is reachable from team-alpha and
# not from team-beta. busybox httpd answers 404 with no docroot, which still
# proves the TCP path; a blocked connection times out instead.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |
      set -e
      kubectl -n team-alpha get pod np-target >/dev/null 2>&1 || \
        kubectl -n team-alpha run np-target --image=busybox --restart=Never -- httpd -f -p 8080
      kubectl -n team-alpha wait pod/np-target --for=condition=Ready --timeout=60s
      IP=$(kubectl -n team-alpha get pod np-target -o jsonpath='{.status.podIP}')
      probe() { # namespace -> wget's output against the listener
        kubectl -n "$1" run np-probe --image=busybox --restart=Never --rm -i --quiet \
          --command -- sh -c "wget -T 3 -O /dev/null http://$IP:8080/ 2>&1 || true"
      }
      probe team-alpha | grep -q 404
      if probe team-beta | grep -q 404; then exit 1; fi
      kubectl -n team-alpha delete pod np-target --wait=false
