# Local cluster, created by scripts/kind-up.sh.
# Apps are served at http://<host>.localhost:8080 (host 80 is taken by caddy).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      # ingress-nginx's kind provider only schedules onto nodes with this label
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
