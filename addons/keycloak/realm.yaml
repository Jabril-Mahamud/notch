# The notch realm, imported on every Keycloak start (state lives on an emptyDir,
# so this file is the source of truth). Groups map to platform roles: notch-admins
# = cluster-admin / ArgoCD admin / Grafana Admin, team-* = their tenant namespace.
# ${VAR} placeholders are filled from keycloak-secrets (kind-up.sh), so no
# credential is in git.
# User ids are fixed: the realm is re-imported on every start, and a new id
# means a new `sub`, which breaks Grafana's link to existing users.
# ponytail: directAccessGrants (password grant) on every client, for kuttl and
# scripted logins. Off for any real environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  notch-realm.json: |
    {
      "realm": "notch",
      "enabled": true,
      "groups": [
        {
          "name": "notch-admins"
        },
        {
          "name": "team-alpha"
        },
        {
          "name": "team-beta"
        }
      ],
      "users": [
        {
          "id": "8f4c87bb-f58d-5ba9-a8dd-8b2195cd112d",
          "username": "jabril",
          "enabled": true,
          "email": "jabril@notch.localhost",
          "emailVerified": true,
          "firstName": "Jabril",
          "lastName": "Notch",
          "credentials": [
            {
              "type": "password",
              "value": "${NOTCH_USER_PASSWORD}",
              "temporary": false
            }
          ],
          "groups": [
            "/notch-admins"
          ]
        },
        {
          "id": "49301b67-b9ea-5b10-b264-1e645ba9fed7",
          "username": "alice",
          "enabled": true,
          "email": "alice@notch.localhost",
          "emailVerified": true,
          "firstName": "Alice",
          "lastName": "Notch",
          "credentials": [
            {
              "type": "password",
              "value": "${NOTCH_USER_PASSWORD}",
              "temporary": false
            }
          ],
          "groups": [
            "/team-alpha"
          ]
        },
        {
          "id": "41426c21-a072-592b-be02-9cfa2e744f3a",
          "username": "bob",
          "enabled": true,
          "email": "bob@notch.localhost",
          "emailVerified": true,
          "firstName": "Bob",
          "lastName": "Notch",
          "credentials": [
            {
              "type": "password",
              "value": "${NOTCH_USER_PASSWORD}",
              "temporary": false
            }
          ],
          "groups": [
            "/team-beta"
          ]
        }
      ],
      "clients": [
        {
          "clientId": "kubernetes",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://localhost:8000/*",
            "http://localhost:18000/*"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "argocd",
          "publicClient": false,
          "secret": "${ARGOCD_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "https://argocd.notch.localhost/auth/callback"
          ],
          "webOrigins": [
            "https://argocd.notch.localhost"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "grafana",
          "publicClient": false,
          "secret": "${GRAFANA_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "https://grafana.notch.localhost/login/generic_oauth"
          ],
          "webOrigins": [
            "https://grafana.notch.localhost"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
