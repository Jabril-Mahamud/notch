# List keys avoid name/values/server: the cluster generator sets those, and
# in a matrix its params shadow the list's.
# Platform for every non-dev environment (staging today), deployed by this
# ArgoCD into the env's cluster. Lean on purpose: no observability stack and no
# Keycloak, to keep a second Kind cluster within RAM. Chart versions repeat
# addons/*.yaml; tests/environments.sh fails on drift.
# ponytail: a list here, not every addon turned into an ApplicationSet. When an
# env needs the full stack, convert addons/*.yaml to cluster-generator AppSets.
# No sync waves across generated apps: ordering rides on retries (CRDs land,
# the next attempt applies).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: env-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - { key: notch.dev/env, operator: NotIn, values: [dev] }
          - list:
              elements:
                - addon: ingress-nginx
                  repoURL: https://kubernetes.github.io/ingress-nginx
                  chart: ingress-nginx
                  version: "4.15.1"
                  namespace: ingress-nginx
                  # Same as dev: hostPort on the ingress-ready node (kind-staging.yaml maps it).
                  helmValues: |
                    controller:
                      hostPort: { enabled: true }
                      service: { type: NodePort }
                      nodeSelector: { ingress-ready: "true" }
                      tolerations:
                        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
                      ingressClassResource: { default: true }
                      publishService: { enabled: false }
                      extraArgs: { publish-status-address: localhost }
                - addon: cert-manager
                  repoURL: https://charts.jetstack.io
                  chart: cert-manager
                  version: "v1.21.2"
                  namespace: cert-manager
                  helmValues: |
                    crds: { enabled: true }
                - addon: cloudnative-pg
                  repoURL: https://cloudnative-pg.github.io/charts
                  chart: cloudnative-pg
                  version: "0.29.1"
                  namespace: cnpg-system
                  helmValues: ""
                - addon: crossplane
                  repoURL: https://charts.crossplane.io/stable
                  chart: crossplane
                  version: "1.20.13"
                  namespace: crossplane-system
                  helmValues: ""
                - addon: external-secrets
                  repoURL: https://charts.external-secrets.io
                  chart: external-secrets
                  version: "2.12.0"
                  namespace: external-secrets
                  helmValues: ""
                - addon: reloader
                  repoURL: https://stakater.github.io/stakater-charts
                  chart: reloader
                  version: "2.2.18"
                  namespace: reloader
                  helmValues: |
                    reloader: { reloadOnCreate: true }
  template:
    metadata:
      name: '{{ .addon }}-{{ index .metadata.labels "notch.dev/env" }}'
    spec:
      project: default
      source:
        repoURL: "{{ .repoURL }}"
        chart: "{{ .chart }}"
        targetRevision: "{{ .version }}"
        helm:
          values: "{{ .helmValues }}"
      destination:
        server: "{{ .server }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
---
# The platform's own manifests (issuer, provider, Postgres API, shared DB) from
# the env's branch, so staging runs main's platform, not dev's.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: env-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - { key: notch.dev/env, operator: NotIn, values: [dev] }
          - list:
              elements:
                - { addon: cert-manager-issuer, path: addons, include: cert-manager-issuer.yaml }
                - { addon: crossplane-provider-sql, path: addons, include: crossplane-provider-sql.yaml }
                - { addon: external-secrets-store, path: addons, include: external-secrets-store.yaml }
                - { addon: notch-postgres, path: addons/notch-postgres, include: "*.yaml" }
                - { addon: infra, path: addons/infra, include: "*.yaml" }
  template:
    metadata:
      name: '{{ .addon }}-{{ index .metadata.labels "notch.dev/env" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Jabril-Mahamud/notch.git
        targetRevision: '{{ index .metadata.annotations "notch.dev/revision" }}'
        path: "{{ .path }}"
        directory:
          include: "{{ .include }}"
      destination:
        server: "{{ .server }}"
        namespace: default
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
