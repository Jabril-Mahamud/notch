# Kind backend for the chart's ExternalSecrets: operators create
# <service>-secrets in the notch-secrets namespace (made by kind-up.sh), ESO
# copies the listed keys into the service namespace. Secrets Manager replaces
# this in Phase 3.
# Applied by the root app at wave 3: the ESO Application (wave 2) brings the CRD
# and the external-secrets namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
# Namespaced, not a ClusterRole: cluster-wide secret read would also hand out
# notch-pg-superuser to anything that can name the store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-reader
  namespace: notch-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # ESO checks its own access here before marking the store Ready.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-reader
  namespace: notch-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: external-secrets-reader
    namespace: external-secrets
roleRef:
  kind: Role
  name: external-secrets-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: notch-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    kubernetes:
      remoteNamespace: notch-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets-reader
          namespace: external-secrets
