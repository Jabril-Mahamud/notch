# Applied directly by the root app, not via Helm: provider-sql is a Crossplane
# package. Its CRD comes from the crossplane chart (wave 2), so this sits a wave
# later, once the crossplane Application is Healthy.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sql
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # xpkg.crossplane.io, not xpkg.upbound.io: the upbound mirror has stale tags.
  # Talks to CNPG in-cluster, so no cloud credentials and no runtimeConfigRef.
  package: xpkg.crossplane.io/crossplane-contrib/provider-sql:v0.16.2
---
# Group is postgresql.sql.crossplane.io, not sql.crossplane.io: provider-sql
# ships a ProviderConfig per database flavour. Managed resources in PR 5 must
# name it via providerConfigRef or they wait forever for "default".
# The CNPG cluster and superuser secret arrive in PR 5/6; until then this
# config exists but nothing uses it.
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: notch-shared-pg
  annotations:
    # After the Provider has installed its CRDs.
    argocd.argoproj.io/sync-wave: "4"
spec:
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef:
      namespace: platform-db
      name: notch-pg-superuser
  # CNPG serves TLS with its own internal CA, so the verify-full default fails.
  sslMode: require
