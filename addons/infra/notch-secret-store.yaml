---
# ClusterSecretStore that reads Secrets from the platform-db namespace.
# On Kind, source secrets are created manually (or by kind-up.sh for the
# superuser). On EKS this becomes an AWS Secrets Manager backend (Phase 3).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: notch-secrets
  annotations:
    # After ESO (wave 2), before the pg-superuser ExternalSecret (wave 6)
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    kubernetes:
      # Read source secrets from the central platform namespace
      server:
        url: https://kubernetes.default.svc
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
      remoteRef:
        namespace: platform-db
