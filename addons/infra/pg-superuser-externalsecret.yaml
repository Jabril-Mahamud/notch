---
# CNPG writes its superuser secret with key "host"; provider-sql wants
# "endpoint". This ExternalSecret renames host → endpoint so the
# ProviderConfig can consume the connection details without manual patching.
# (gotcha 6: provider-sql wants endpoint, CNPG writes host)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notch-pg-provider-config
  namespace: platform-db
  annotations:
    # After the CNPG cluster (wave 5) and ESO (wave 2)
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: notch-secrets
  target:
    name: notch-pg-provider-config
  data:
    - secretKey: endpoint
      remoteRef:
        key: notch-pg-superuser
        property: host
    - secretKey: port
      remoteRef:
        key: notch-pg-superuser
        property: port
    - secretKey: username
      remoteRef:
        key: notch-pg-superuser
        property: username
    - secretKey: password
      remoteRef:
        key: notch-pg-superuser
        property: password
    - secretKey: database
      remoteRef:
        key: notch-pg-superuser
        property: database
    - secretKey: sslmode
      remoteRef:
        key: notch-pg-superuser
        property: sslmode
