---
# Crossplane ProviderConfig for provider-sql (PostgreSQL flavour).
# The notch-service chart's Database/Role CRs reference this by name.
# Group is postgresql.sql.crossplane.io, not sql.crossplane.io: provider-sql
# ships a separate ProviderConfig per database flavour.
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: notch-shared-pg
  annotations:
    # After the CNPG cluster (wave 5) so the endpoint resolves
    argocd.argoproj.io/sync-wave: "6"
spec:
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef:
      namespace: platform-db
      name: notch-pg-provider-config
  # CNPG serves TLS with its own internal CA, so verify-full fails
  sslMode: require
