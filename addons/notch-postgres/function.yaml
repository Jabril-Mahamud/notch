# Compositions run as a pipeline of functions; this one is the classic
# patch-and-transform. Crossplane package, so the root app applies it directly.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    # Function CRD comes from the crossplane chart (wave 2).
    argocd.argoproj.io/sync-wave: "3"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.10.11
