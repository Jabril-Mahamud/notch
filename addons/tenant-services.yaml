# One Application per tenants/<tenant>/services/<svc>/, rendered through the same
# charts/notch-service as platform services but into the tenant's namespace, so
# the tenant's RBAC, quota and network policies apply to it.
# Wave 8: after the tenants ApplicationSet (7) creates the namespaces.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Jabril-Mahamud/notch.git
        revision: dev
        directories:
          - path: tenants/*/services/*
  template:
    metadata:
      # Application names are global; two tenants may both have a "web"
      name: "{{index .path.segments 1}}-{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/Jabril-Mahamud/notch.git
        targetRevision: dev
        path: charts/notch-service
        helm:
          parameters:
            - name: namespace
              value: "{{index .path.segments 1}}"
          valueFiles:
            - ../../{{.path.path}}/service.yaml
            - ../../{{.path.path}}/local/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
